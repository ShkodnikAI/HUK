services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: huk
      POSTGRES_PASSWORD: huk
      POSTGRES_DB: huk
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U huk -d huk"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Local SMTP sink for magic links (dev/preview only): SMTP on 1025,
  # web UI on 8025 — open http://localhost:8025 to read the mail.
  mailpit:
    image: axllent/mailpit:v1.31.4
    ports:
      - "1025:1025"
      - "8025:8025"

  web:
    build:
      context: .
      target: web
    environment:
      DATABASE_URL: postgresql://huk:huk@postgres:5432/huk
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env (openssl rand -base64 32)}
      # H-110: next-auth v4 reads ONLY NEXTAUTH_URL; keep AUTH_TRUST_HOST unset.
      # The images run NODE_ENV=production, so S8 (H-110) demands an https://
      # base URL even for the local stack — hence the https localhost default.
      # End-to-end magic-link testing locally: bare `next dev` (NODE_ENV=development,
      # http is fine there) + `docker compose up -d mailpit`.
      NEXTAUTH_URL: ${NEXTAUTH_URL:-https://localhost:3000}
      # Development defaults for the settings production requires (H-103, S8).
      # They carry the repo-wide do-not-use-in-prod dev-salt naming and exist
      # ONLY so a local `docker compose up` boots. A production deployment must
      # set real values in its own environment and must not inherit these —
      # overriding via .env/shell is the intended escape hatch.
      IP_HASH_SALT: ${IP_HASH_SALT:-huk-dev-ip-hash-salt-do-not-use-in-prod}
      CLIENT_IP_HEADER: ${CLIENT_IP_HEADER:-cf-connecting-ip}
      # Magic links are sent to the local mailpit sink (read: :8025).
      EMAIL_SERVER: ${EMAIL_SERVER:-smtp://mailpit:1025}
      # H-112 (D14): the web container serves the broadcast cache read-only.
      AUDIO_CACHE_DIR: ${AUDIO_CACHE_DIR:-/var/lib/huk/audio-cache}
      AUDIO_CACHE_MAX_BYTES: ${AUDIO_CACHE_MAX_BYTES:-419430400}
    volumes:
      - audio_cache:/var/lib/huk/audio-cache:ro
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    # Phase 1: migrations are applied by the web container before start
    # (single VPS; the worker never migrates — ARCHITECTURE §2).
    command: ["sh", "-c", "bunx prisma migrate deploy && bun run start"]

  worker:
    build:
      context: .
      target: worker
    environment:
      DATABASE_URL: postgresql://huk:huk@postgres:5432/huk
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env (openssl rand -base64 32)}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-https://localhost:3000}
      IP_HASH_SALT: ${IP_HASH_SALT:-huk-dev-ip-hash-salt-do-not-use-in-prod}
      CLIENT_IP_HEADER: ${CLIENT_IP_HEADER:-cf-connecting-ip}
      EMAIL_SERVER: ${EMAIL_SERVER:-smtp://mailpit:1025}
      # H-112 (D14): the worker is the only writer of the broadcast cache.
      AUDIO_CACHE_DIR: ${AUDIO_CACHE_DIR:-/var/lib/huk/audio-cache}
      AUDIO_CACHE_MAX_BYTES: ${AUDIO_CACHE_MAX_BYTES:-419430400}
    volumes:
      - audio_cache:/var/lib/huk/audio-cache
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # PID 1 is the worker process; kill -0 proves it is alive.
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pgdata: {}
  audio_cache: {}
