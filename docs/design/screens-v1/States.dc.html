  <section aria-label="Radio is quiet" style="flex:1;border-radius:16px;background:#23242A;border:1px solid #34353C;padding:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center">

    <h2 style="margin:10px 0 6px 0;font-size:18px;font-weight:600">The radio is quiet for a moment</h2>
    <p style="margin:0;font-size:13px;line-height:1.55;color:#A3A4A9">We are lining up the next track. The player will start by itself.</p>
    <button type="button" style="margin-top:14px;min-height:44px;padding:0 20px;border-radius:12px;border:1px solid #34353C;background:#2C2D34;color:#ECEBE6;font:500 14px 'Inter',sans-serif">Try again now</button>
  </section>

  <section aria-label="Offline" style="flex:1;border-radius:16px;background:#23242A;border:1px solid #34353C;padding:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center">
    <div aria-hidden="true" style="color:#D4AF37"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9a14 14 0 0 1 4-2.600M21 9a14 14 0 0 0-8-3.900M6.500 12.500a9 9 0 0 1 3-1.700M17.500 12.500a9 9 0 0 0-3.500-2M9.500 16a4 4 0 0 1 5 0M12 20h.01M3 3l18 18"/></svg></div>

    <p style="margin:0;font-size:13px;line-height:1.55;color:#A3A4A9">The radio needs a connection. Playback resumes when you are back online.</p>
  </section>

  <section aria-label="Page not found" style="flex:1;border-radius:16px;background:#23242A;border:1px solid #34353C;padding:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center">

    <h2 style="margin:8px 0 6px 0;font-size:18px;font-weight:600">We could not find that page</h2>
    <p style="margin:0;font-size:13px;line-height:1.55;color:#A3A4A9">A track may have been removed, or the link is wrong.</p>
    <a href="Main.dc.html" style="margin-top:14px;min-height:44px;padding:0 20px;border-radius:12px;background:#D4AF37;color:#1A1B1F;font:600 14px 'Inter',sans-serif;display:flex;align-items:center;text-decoration:none">Back to the radio</a>
  </section>
</div>
