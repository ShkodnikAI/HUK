# HUK seed audio server (H-504): serves the generated seed files
# (scripts/seed-content/make_seed.py) from the seed_audio volume, read-only.
# Reached only through the Cloudflare Tunnel ingress
# (hukradio.com/seed* -> http://seed-audio:80 — see docs/RUNBOOK.md);
# no port is published. Seed files are immutable once generated, but slugs
# are reused across regenerations, so the cache horizon stays at one day
# instead of an immutable year.
server {
  listen 80;
  server_name _;

  # Probe for the compose healthcheck.
  location = /healthz {
    access_log off;
    add_header Content-Type "text/plain";
    return 200 "ok\n";
  }

  location /seed/ {
    alias /var/www/seed/;
    autoindex off;
    types {
      audio/mpeg mp3;
      application/json json;
    }
    default_type application/octet-stream;
    add_header Cache-Control "public, max-age=86400";
    add_header X-Content-Type-Options "nosniff" always;
  }

  # The tunnel routes only /seed* here; anything else is a miss.
  location / {
    return 404;
  }
}
