# HUK production stack (H-504) — standalone file, NOT an override of the dev
# stack in the repo root. Runs on the Owner's host behind a Cloudflare Tunnel
# (docs/RUNBOOK.md). No service publishes a port except web, bound to
# 127.0.0.1:<HUK_WEB_PORT> so the neighbouring project on the host is never
# disturbed. Project name is fixed to `huk` and the network is project-local:
# nothing is shared with other containers on the host (isolation notes in the
# runbook). Every required variable is `:?`-required at config time — a stack
# with missing settings cannot even render (S8/S9); deploy/check-env.sh gates
# the values themselves before that.
name: huk

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in deploy/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:-huk}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    # Never published: reachable only from the internal network.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-huk}"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: ${HUK_PG_MEM:-1g}
          cpus: "${HUK_PG_CPU:-1.0}"
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  web:
    image: huk/huk-web:${HUK_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: Dockerfile
      target: web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Built from the dedicated Postgres credentials; postgres itself is
      # never published (see above).
      DATABASE_URL: postgresql://${POSTGRES_USER:?set POSTGRES_USER in deploy/.env}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}@postgres:5432/${POSTGRES_DB:-huk}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in deploy/.env (openssl rand -base64 32)}
      # H-110: next-auth v4 reads ONLY NEXTAUTH_URL; keep AUTH_TRUST_HOST unset.
      # Must be a real https:// origin in production (S8, fail loud at boot).
      NEXTAUTH_URL: ${NEXTAUTH_URL:?set NEXTAUTH_URL to https://hukradio.com in deploy/.env}
      IP_HASH_SALT: ${IP_HASH_SALT:?set IP_HASH_SALT in deploy/.env (H-103)}
      CLIENT_IP_HEADER: ${CLIENT_IP_HEADER:?set CLIENT_IP_HEADER in deploy/.env (H-103)}
      # Magic links are the only sign-in — a real SMTP account is required (H-102).
      EMAIL_SERVER: ${EMAIL_SERVER:?set EMAIL_SERVER in deploy/.env (H-102)}
      EMAIL_FROM: ${EMAIL_FROM:?set EMAIL_FROM in deploy/.env (must not end in @example.com)}
      # Optional first-admin bootstrap (H-102): while no ADMIN exists, a
      # sign-in with this verified email is promoted to ADMIN. An empty value
      # must not reach the app (S8: min 3 chars — an empty string would crash
      # the boot), so when unset the stack gets a .invalid placeholder that
      # can never match a real verified sign-in: bootstrap stays off.
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-disabled@bootstrap.invalid}
      # H-106/H-504: seed audio is served by the seed-audio container via the tunnel.
      SEED_AUDIO_BASE_URL: ${SEED_AUDIO_BASE_URL:?set SEED_AUDIO_BASE_URL in deploy/.env}
      # H-112 (D14): the web container serves the broadcast cache read-only.
      AUDIO_CACHE_DIR: ${AUDIO_CACHE_DIR:-/var/lib/huk/audio-cache}
      AUDIO_CACHE_MAX_BYTES: ${AUDIO_CACHE_MAX_BYTES:-419430400}
      # S4 outbound doors (defaults mirror src/server/env.ts).
      SAFE_FETCH_ALLOW_HTTP: ${SAFE_FETCH_ALLOW_HTTP:-false}
      SAFE_FETCH_PORTS: ${SAFE_FETCH_PORTS:-443}
      # S6 cost fuse and caps (defaults mirror src/server/env.ts).
      BUDGET_DAILY_MICRO_USD_TOTAL: ${BUDGET_DAILY_MICRO_USD_TOTAL:-1000000}
      PLATFORM_DAILY_SUBMISSION_CAP: ${PLATFORM_DAILY_SUBMISSION_CAP:-10}
      AUTHOR_DAILY_SUBMISSION_CAP: ${AUTHOR_DAILY_SUBMISSION_CAP:-2}
      INVITE_ONLY: ${INVITE_ONLY:-true}
      RETENTION_LISTEN_EVENTS_DAYS: ${RETENTION_LISTEN_EVENTS_DAYS:-90}
      RETENTION_TRANSCRIPTS_DAYS: ${RETENTION_TRANSCRIPTS_DAYS:-90}
      # H-202/H-205 providers: everything ships disabled or empty by default.
      AUDIUS_ENABLED: ${AUDIUS_ENABLED:-false}
      AUDD_ENABLED: ${AUDD_ENABLED:-false}
      AUDIUS_API_KEY: ${AUDIUS_API_KEY:-}
      ACOUSTID_API_KEY: ${ACOUSTID_API_KEY:-}
      AUDD_API_TOKEN: ${AUDD_API_TOKEN:-}
      ASR_API_KEY: ${ASR_API_KEY:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      SOURCE_FULL_HASH_DAYS: ${SOURCE_FULL_HASH_DAYS:-7}
      SOURCE_MAX_FAILS: ${SOURCE_MAX_FAILS:-5}
      SOURCE_VERIFY_BATCH: ${SOURCE_VERIFY_BATCH:-20}
      FINGERPRINT_STRONG_SCORE: ${FINGERPRINT_STRONG_SCORE:-0.9}
      AUDD_SEGMENTS: ${AUDD_SEGMENTS:-4}
    volumes:
      - audio_cache:/var/lib/huk/audio-cache:ro
    ports:
      # The ONLY published port in the whole stack, loopback-only: the tunnel
      # and local administration reach it from the host itself.
      - "127.0.0.1:${HUK_WEB_PORT:-3100}:3000"
    networks: [internal]
    depends_on:
      postgres:
        condition: service_healthy
    # Phase 1: migrations are applied by the web container before start
    # (single VPS; the worker never migrates — ARCHITECTURE §2).
    command: ["sh", "-c", "bunx prisma migrate deploy && bun run start"]
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      # First boot runs the full migration set before start — give it room.
      start_period: 60s
      retries: 5
    deploy:
      resources:
        limits:
          memory: ${HUK_WEB_MEM:-1g}
          cpus: "${HUK_WEB_CPU:-1.0}"
    logging: *logging

  worker:
    image: huk/huk-worker:${HUK_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: Dockerfile
      target: worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:?set POSTGRES_USER in deploy/.env}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}@postgres:5432/${POSTGRES_DB:-huk}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in deploy/.env (openssl rand -base64 32)}
      NEXTAUTH_URL: ${NEXTAUTH_URL:?set NEXTAUTH_URL to https://hukradio.com in deploy/.env}
      IP_HASH_SALT: ${IP_HASH_SALT:?set IP_HASH_SALT in deploy/.env (H-103)}
      CLIENT_IP_HEADER: ${CLIENT_IP_HEADER:?set CLIENT_IP_HEADER in deploy/.env (H-103)}
      EMAIL_SERVER: ${EMAIL_SERVER:?set EMAIL_SERVER in deploy/.env (H-102)}
      EMAIL_FROM: ${EMAIL_FROM:?set EMAIL_FROM in deploy/.env (must not end in @example.com)}
      SEED_AUDIO_BASE_URL: ${SEED_AUDIO_BASE_URL:?set SEED_AUDIO_BASE_URL in deploy/.env}
      # H-112 (D14): the worker is the only writer of the broadcast cache.
      AUDIO_CACHE_DIR: ${AUDIO_CACHE_DIR:-/var/lib/huk/audio-cache}
      AUDIO_CACHE_MAX_BYTES: ${AUDIO_CACHE_MAX_BYTES:-419430400}
      SAFE_FETCH_ALLOW_HTTP: ${SAFE_FETCH_ALLOW_HTTP:-false}
      SAFE_FETCH_PORTS: ${SAFE_FETCH_PORTS:-443}
      BUDGET_DAILY_MICRO_USD_TOTAL: ${BUDGET_DAILY_MICRO_USD_TOTAL:-1000000}
      PLATFORM_DAILY_SUBMISSION_CAP: ${PLATFORM_DAILY_SUBMISSION_CAP:-10}
      AUTHOR_DAILY_SUBMISSION_CAP: ${AUTHOR_DAILY_SUBMISSION_CAP:-2}
      INVITE_ONLY: ${INVITE_ONLY:-true}
      RETENTION_LISTEN_EVENTS_DAYS: ${RETENTION_LISTEN_EVENTS_DAYS:-90}
      RETENTION_TRANSCRIPTS_DAYS: ${RETENTION_TRANSCRIPTS_DAYS:-90}
      AUDIUS_ENABLED: ${AUDIUS_ENABLED:-false}
      AUDD_ENABLED: ${AUDD_ENABLED:-false}
      AUDIUS_API_KEY: ${AUDIUS_API_KEY:-}
      ACOUSTID_API_KEY: ${ACOUSTID_API_KEY:-}
      AUDD_API_TOKEN: ${AUDD_API_TOKEN:-}
      ASR_API_KEY: ${ASR_API_KEY:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      SOURCE_FULL_HASH_DAYS: ${SOURCE_FULL_HASH_DAYS:-7}
      SOURCE_MAX_FAILS: ${SOURCE_MAX_FAILS:-5}
      SOURCE_VERIFY_BATCH: ${SOURCE_VERIFY_BATCH:-20}
      FINGERPRINT_STRONG_SCORE: ${FINGERPRINT_STRONG_SCORE:-0.9}
      AUDD_SEGMENTS: ${AUDD_SEGMENTS:-4}
    volumes:
      - audio_cache:/var/lib/huk/audio-cache
    networks: [internal]
    depends_on:
      postgres:
        condition: service_healthy
      # First boot: the schema exists only after web runs `prisma migrate
      # deploy` (the worker never migrates — ARCHITECTURE §2). Starting the
      # worker after web is healthy avoids erroring into the not-yet-migrated
      # database on the very first boot.
      web:
        condition: service_healthy
    healthcheck:
      # PID 1 is the worker process; kill -0 proves it is alive.
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        # ffmpeg/fpcalc passes are the heaviest work in the stack.
        limits:
          memory: ${HUK_WORKER_MEM:-1536m}
          cpus: "${HUK_WORKER_CPU:-1.0}"
    logging: *logging

  # Seed audio (H-106/H-504): static server for the generated seed files,
  # read-only from the seed_audio volume. Reached ONLY through the tunnel
  # ingress (hukradio.com/seed* -> http://seed-audio:80, see RUNBOOK) —
  # no published port. nginx is used instead of an app route so the web
  # image stays minimal (attack surface) and no application code is needed
  # for static file serving with cache headers.
  seed-audio:
    image: nginx:1.29-alpine
    restart: unless-stopped
    volumes:
      - seed_audio:/var/www/seed:ro
      - ./seed-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.25"
    logging: *logging

  # Cloudflare Tunnel sidecar (named tunnel from CLOUDFLARE_TUNNEL_TOKEN).
  # Gated behind the `tunnel` profile so drills and CI can start the stack
  # with a local stand-in (no token needed); deploy/up.sh enables the profile.
  cloudflared:
    image: cloudflare/cloudflared:2025.9.1
    command: tunnel --no-autoupdate run
    restart: unless-stopped
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?create a named tunnel in the Cloudflare dashboard and put its token in deploy/.env}
    networks: [internal]
    profiles: ["tunnel"]
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
    logging: *logging

  # One-shot (H-504): registers the seed audio files from the volume as SEED
  # tracks. Idempotent (upsert by externalId). Run explicitly:
  #   docker compose -p huk --profile seed -f deploy/docker-compose.prod.yml \
  #     --env-file deploy/.env run --rm seed-register
  # Uses the worker image (ffprobe is needed to measure durations).
  seed-register:
    image: huk/huk-worker:${HUK_IMAGE_TAG:-latest}
    command: ["bun", "prisma/seed-tracks.ts", "/seed"]
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?set POSTGRES_USER in deploy/.env}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}@postgres:5432/${POSTGRES_DB:-huk}
      SEED_AUDIO_BASE_URL: ${SEED_AUDIO_BASE_URL:?set SEED_AUDIO_BASE_URL in deploy/.env}
    volumes:
      - seed_audio:/seed:ro
    networks: [internal]
    depends_on:
      postgres:
        condition: service_healthy
      web:
        condition: service_healthy
    profiles: ["seed"]

volumes:
  pgdata: {}
  audio_cache: {}
  seed_audio: {}

networks:
  internal: {}
