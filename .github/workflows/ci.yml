name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read

jobs:
  invariants:
    name: invariants (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - name: Route authorization guard (S1)
        run: node scripts/ci/check-route-auth.mjs
      - name: No raw outbound HTTP (S4)
        run: node scripts/ci/check-no-raw-fetch.mjs
      - name: Docs are English (AGENTS §9)
        run: node scripts/ci/check-docs-language.mjs
      - name: No large files / databases in git
        run: node scripts/ci/check-large-files.mjs
      - name: No direct process.env outside src/server/env.ts (S8, H-107)
        run: node scripts/ci/check-no-process-env.mjs
      - name: No edge runtime — Node.js only (S8 boot validation, H-109)
        run: node scripts/ci/check-no-edge-runtime.mjs
      - name: Provider adapters fetch only through budget.guard (S6, H-204)
        run: node scripts/ci/check-provider-guard.mjs
      - name: Audio writes confined to the broadcast cache (S3, D14, H-112)
        run: |
          node scripts/ci/audio-store.mjs
          node scripts/ci/audio-store.mjs --selftest
      - name: Kustomize renders and passes the invariant checker (H-504, K8s)
        run: |
          kubectl kustomize -o json k8s/overlays/prod > /tmp/k8s-prod.json
          node scripts/ci/check-k8s-manifests.mjs /tmp/k8s-prod.json
          kubectl kustomize -o json k8s/overlays/prod-no-tunnel > /tmp/k8s-notunnel.json
          node scripts/ci/check-k8s-manifests.mjs /tmp/k8s-notunnel.json
      - name: The same checker must reject a deliberately broken stack (H-504, K8s)
        run: |
          kubectl kustomize -o json k8s/tests/bad > /tmp/k8s-bad.json
          if node scripts/ci/check-k8s-manifests.mjs /tmp/k8s-bad.json; then
            echo "FAIL: the checker accepted a deliberately broken stack"
            exit 1
          fi
          echo "checker rejected the broken overlay as required"
      - name: shellcheck on the k8s scripts (H-504 task 3)
        run: shellcheck k8s/check-env.sh k8s/base/scripts/*.sh k8s/tests/*.sh
      - name: check-env.sh test suite (H-504 task 2)
        run: sh k8s/tests/check-env.test.sh

  secrets:
    name: gitleaks (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  detect:
    name: detect app scaffold
    runs-on: ubuntu-latest
    outputs:
      has_app: ${{ steps.check.outputs.has_app }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        # hashFiles() is not allowed in jobs.<id>.if, only inside steps;
        # this job exposes the result so `app` can be skipped until H-003.
        run: |
          if [ -f package.json ]; then echo "has_app=true" >> "$GITHUB_OUTPUT"; else echo "has_app=false" >> "$GITHUB_OUTPUT"; fi

  app:
    name: lint-typecheck-test-build (blocking)
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.has_app == 'true'
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: ci, POSTGRES_DB: huk }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:ci@localhost:5432/huk
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx prisma validate
      - run: bunx prisma migrate deploy
        if: hashFiles('prisma/migrations/**') != ''
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      # H-306: the database suite must also pass against a database whose
      # DEFAULT time zone is not UTC — the condition that silently broke the
      # station on the Owner's host (Europe/Minsk). The runner ALTERs the
      # database default zone, proves it took effect, then runs tests/db;
      # red here means the time-zone mechanism or the explicit SQL broke.
      - name: DB suite under a non-UTC database — Europe/Minsk (H-306)
        run: bun tests/db/run-under-timezone.mjs Europe/Minsk
      - name: DB suite under a non-UTC database — America/Los_Angeles (H-306)
        run: bun tests/db/run-under-timezone.mjs America/Los_Angeles
      - run: bun run build

  branch-freshness:
    name: branch-freshness (blocking)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: PR must not be far behind main
        run: |
          behind=$(git rev-list --count HEAD..origin/main || echo 0)
          echo "behind main by $behind commits"
          [ "$behind" -le 20 ] || { echo "Rebase onto main first"; exit 1; }

  # H-111: proves the compose stack boots end to end and the images stay
  # non-root. NOT a required check — the Owner decides on ruleset inclusion.
  docker-smoke:
    name: docker-smoke
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: huk-smoke
    steps:
      - uses: actions/checkout@v7
      - name: Generate a throwaway AUTH_SECRET at runtime (never committed)
        run: echo "AUTH_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - name: Build both images
        run: docker compose build
      - name: Start the stack and wait for health
        run: docker compose up -d --wait --wait-timeout 180
      - name: Both containers run as non-root (H-108)
        run: |
          web_uid="$(docker compose exec -T web id -u)"
          worker_uid="$(docker compose exec -T worker id -u)"
          echo "web uid=$web_uid worker uid=$worker_uid"
          [ "$web_uid" != "0" ] || { echo "web runs as root"; exit 1; }
          [ "$worker_uid" != "0" ] || { echo "worker runs as root"; exit 1; }
      - name: Worker image has ffprobe/ffmpeg, fpcalc and the policy file (H-204, H-205)
        run: |
          docker compose exec -T worker ffprobe -version | head -1
          docker compose exec -T worker ffmpeg -version | head -1
          docker compose exec -T worker fpcalc -version | head -1
          docker compose exec -T worker test -f policy/moderation-policy.md
          echo "worker ffmpeg + fpcalc + policy: OK"
      - name: GET /api/health answers 200
        run: |
          code="$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/health)"
          echo "health: $code"
          [ "$code" = "200" ]
      - name: GET /api/radio/now answers 200
        run: |
          code="$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/radio/now)"
          echo "radio/now: $code"
          [ "$code" = "200" ]
      - name: Compose logs contain no S8 boot failure
        run: |
          docker compose logs > compose-logs.txt || true
          cat compose-logs.txt
          if grep -qiE "Invalid environment \(S8\)|refusing to start" compose-logs.txt; then
            echo "S8 boot failure found in the logs"
            exit 1
          fi
      - name: Worker stops cleanly on SIGTERM (exit 0)
        run: docker compose stop worker
      - name: Dump compose logs on failure
        if: failure()
        run: docker compose logs > compose-logs.txt || true
      - name: Upload compose logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: compose-logs
          path: compose-logs.txt
      - name: Tear down
        if: always()
        run: docker compose down -v

  # H-504 (Kubernetes edition): full drill of the production stack on a kind
  # cluster, with throw-away secrets and no tunnel. Proves the same done
  # criteria the compose drill proved: the stack boots from the k8s/ overlays,
  # a migration ran, /api/health answers, only ClusterIP services exist (the
  # cluster publishes nothing), update/rollback mechanics work, the backup ->
  # restore round trip lands the data in a scratch database, and the kill
  # switch takes the site offline and back. NOT a required check — the Owner
  # decides on ruleset inclusion.
  deploy-smoke:
    name: deploy-smoke (k8s stack drill)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install kind (pinned)
        run: |
          curl -sSL -o kind https://kind.sigs.k8s.io/dl/v0.23.0/kind-linux-amd64
          chmod +x kind
          sudo mv kind /usr/local/bin/kind
          kind version
      - name: Create the drill cluster
        run: kind create cluster --name huk-drill --wait 180s
      - name: Build the release images (same Dockerfile, both targets)
        run: |
          docker build --target web -t huk/huk-web:ci .
          docker build --target worker -t huk/huk-worker:ci .
      - name: Load the images into the cluster (the host-import equivalent)
        run: kind load docker-image huk/huk-web:ci huk/huk-worker:ci --name huk-drill
      - name: Write a throw-away env file, gate it, create the secret (never committed)
        run: |
          PW="$(openssl rand -hex 16)"
          mkdir -p k8s
          cat > k8s/.env <<EOF
          POSTGRES_USER="huk"
          POSTGRES_PASSWORD="$PW"
          POSTGRES_DB="huk"
          DATABASE_URL="postgresql://huk:$PW@huk-postgres:5432/huk"
          AUTH_SECRET="$(openssl rand -base64 32)"
          NEXTAUTH_URL="https://hukradio.com"
          IP_HASH_SALT="$(openssl rand -base64 24)"
          CLIENT_IP_HEADER="cf-connecting-ip"
          EMAIL_SERVER="smtp://ci-smoke:ci-smoke@smtp.ci-smoke.invalid:587"
          EMAIL_FROM="HUK <no-reply@hukradio.com>"
          SEED_AUDIO_BASE_URL="https://hukradio.com/seed"
          AUDIO_CACHE_DIR="/var/lib/huk/audio-cache"
          AUDIO_CACHE_MAX_BYTES="419430400"
          CLOUDFLARE_TUNNEL_TOKEN="ci-smoke-fake-tunnel-token-not-a-secret"
          HUK_WEB_PORT="3100"
          EOF
          chmod 600 k8s/.env
          sh k8s/check-env.sh k8s/.env
          kubectl apply -f k8s/base/namespace.yaml
          kubectl -n huk create secret generic huk-env --from-env-file=k8s/.env
      - name: Apply the CI overlay (no tunnel — the --no-tunnel equivalent)
        run: kubectl apply -k k8s/overlays/ci
      - name: Wait for every workload to become available
        run: |
          kubectl -n huk rollout status --timeout=600s statefulset/huk-postgres
          kubectl -n huk rollout status --timeout=600s deployment/huk-web
          kubectl -n huk rollout status --timeout=600s deployment/huk-worker
          kubectl -n huk rollout status --timeout=600s deployment/huk-seed-audio
      - name: Migration ran (web applies prisma migrations before start)
        run: |
          n="$(kubectl -n huk exec statefulset/huk-postgres -- psql -U huk -d huk -At -c 'SELECT count(*) FROM _prisma_migrations')"
          echo "migrations applied: $n"
          [ "$n" -ge 1 ]
      - name: Only ClusterIP services exist — the cluster publishes nothing (live check)
        run: |
          kubectl -n huk get svc
          types="$(kubectl -n huk get svc -o jsonpath='{range .items[*]}{.spec.type}{"\n"}{end}')"
          echo "$types"
          noncluster="$(printf '%s\n' "$types" | grep -cv ClusterIP || true)"
          [ "$noncluster" = "0" ] || { echo "FAIL: non-ClusterIP service found"; exit 1; }
      - name: GET /api/health answers 200 through port-forward
        run: |
          kubectl -n huk port-forward svc/huk-web 3100:3000 > /tmp/pf.log 2>&1 &
          PF=$!
          code=000
          for i in $(seq 1 45); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/api/health || true)"
            [ "$code" = "200" ] && break
            sleep 2
          done
          kill $PF 2>/dev/null || true
          echo "health: $code"
          [ "$code" = "200" ]
      - name: backup -> restore round trip into a scratch database (done criteria)
        run: |
          kubectl -n huk exec statefulset/huk-postgres -- psql -U huk -d huk -c "CREATE TABLE drill_marker (id int PRIMARY KEY, note text)"
          kubectl -n huk exec statefulset/huk-postgres -- psql -U huk -d huk -c "INSERT INTO drill_marker VALUES (42, 'k8s-drill-marker')"
          kubectl -n huk create job --from=cronjob/huk-backup drill-backup
          kubectl -n huk wait --for=condition=complete job/drill-backup --timeout=300s
          kubectl -n huk logs job/drill-backup
          kubectl -n huk delete job huk-restore-drill --ignore-not-found
          kubectl apply -f k8s/jobs/restore-drill.yaml
          kubectl -n huk wait --for=condition=complete job/huk-restore-drill --timeout=600s
          kubectl -n huk logs job/huk-restore-drill | tee /tmp/restore.log
          grep -q "drill_marker verified: k8s-drill-marker" /tmp/restore.log
          kubectl -n huk delete job huk-restore-drill drill-backup
      - name: Kill switch — scale to zero takes the site offline, start brings it back
        run: |
          kubectl -n huk scale deployment/huk-web --replicas=0
          kubectl -n huk wait --for=delete pod -l app.kubernetes.io/component=web --timeout=120s
          kubectl -n huk port-forward svc/huk-web 3101:3000 > /tmp/pf2.log 2>&1 &
          PF=$!
          sleep 2
          code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:3101/api/health || true)"
          kill $PF 2>/dev/null || true
          [ "$code" != "200" ] || { echo "FAIL: site still answers after the kill switch"; exit 1; }
          echo "site offline (health code: $code)"
          kubectl -n huk scale deployment/huk-web --replicas=1
          kubectl -n huk rollout status --timeout=600s deployment/huk-web
          kubectl -n huk port-forward svc/huk-web 3102:3000 > /tmp/pf3.log 2>&1 &
          PF=$!
          code=000
          for i in $(seq 1 45); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3102/api/health || true)"
            [ "$code" = "200" ] && break
            sleep 2
          done
          kill $PF 2>/dev/null || true
          echo "site back online (health code: $code)"
          [ "$code" = "200" ]
      - name: A broken image fails its rollout; retagging back restores it (release mechanics)
        run: |
          docker build -t huk/huk-web:broken -t huk/huk-worker:broken -f- . <<'DOCKERFILE'
          FROM busybox:1.36
          CMD ["false"]
          DOCKERFILE
          kind load docker-image huk/huk-web:broken huk/huk-worker:broken --name huk-drill
          sed -i 's/newTag: ci/newTag: broken/' k8s/overlays/ci/kustomization.yaml
          kubectl apply -k k8s/overlays/ci
          if kubectl -n huk rollout status --timeout=120s deployment/huk-web; then
            echo "FAIL: the broken image rolled out"
            exit 1
          fi
          echo "broken rollout failed as expected"
          sed -i 's/newTag: broken/newTag: ci/' k8s/overlays/ci/kustomization.yaml
          kubectl apply -k k8s/overlays/ci
          kubectl -n huk rollout status --timeout=600s deployment/huk-web
          kubectl -n huk rollout status --timeout=600s deployment/huk-worker
      - name: Stack healthy again on the release tag
        run: |
          kubectl -n huk port-forward svc/huk-web 3103:3000 > /tmp/pf4.log 2>&1 &
          PF=$!
          code=000
          for i in $(seq 1 45); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3103/api/health || true)"
            [ "$code" = "200" ] && break
            sleep 2
          done
          kill $PF 2>/dev/null || true
          echo "health after rollback: $code"
          [ "$code" = "200" ]
      - name: Dump cluster state on failure
        if: failure()
        run: |
          {
            kubectl -n huk get pods -o wide
            kubectl -n huk get events --sort-by=.lastTimestamp
            kubectl -n huk logs --all-containers --tail=200 deploy/huk-web deploy/huk-worker statefulset/huk-postgres deploy/huk-seed-audio
          } > k8s-drill-logs.txt || true
      - name: Upload drill logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: k8s-drill-logs
          path: k8s-drill-logs.txt
      - name: Tear down the drill cluster
        if: always()
        run: kind delete cluster --name huk-drill
