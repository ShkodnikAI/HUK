name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read

jobs:
  invariants:
    name: invariants (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - name: Route authorization guard (S1)
        run: node scripts/ci/check-route-auth.mjs
      - name: No raw outbound HTTP (S4)
        run: node scripts/ci/check-no-raw-fetch.mjs
      - name: Docs are English (AGENTS §9)
        run: node scripts/ci/check-docs-language.mjs
      - name: No large files / databases in git
        run: node scripts/ci/check-large-files.mjs
      - name: No direct process.env outside src/server/env.ts (S8, H-107)
        run: node scripts/ci/check-no-process-env.mjs
      - name: No edge runtime — Node.js only (S8 boot validation, H-109)
        run: node scripts/ci/check-no-edge-runtime.mjs
      - name: Provider adapters fetch only through budget.guard (S6, H-204)
        run: node scripts/ci/check-provider-guard.mjs
      - name: Audio writes confined to the broadcast cache (S3, D14, H-112)
        run: |
          node scripts/ci/audio-store.mjs
          node scripts/ci/audio-store.mjs --selftest

  secrets:
    name: gitleaks (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  detect:
    name: detect app scaffold
    runs-on: ubuntu-latest
    outputs:
      has_app: ${{ steps.check.outputs.has_app }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        # hashFiles() is not allowed in jobs.<id>.if, only inside steps;
        # this job exposes the result so `app` can be skipped until H-003.
        run: |
          if [ -f package.json ]; then echo "has_app=true" >> "$GITHUB_OUTPUT"; else echo "has_app=false" >> "$GITHUB_OUTPUT"; fi

  app:
    name: lint-typecheck-test-build (blocking)
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.has_app == 'true'
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: ci, POSTGRES_DB: huk }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:ci@localhost:5432/huk
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx prisma validate
      - run: bunx prisma migrate deploy
        if: hashFiles('prisma/migrations/**') != ''
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build

  branch-freshness:
    name: branch-freshness (blocking)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: PR must not be far behind main
        run: |
          behind=$(git rev-list --count HEAD..origin/main || echo 0)
          echo "behind main by $behind commits"
          [ "$behind" -le 20 ] || { echo "Rebase onto main first"; exit 1; }

  # H-111: proves the compose stack boots end to end and the images stay
  # non-root. NOT a required check — the Owner decides on ruleset inclusion.
  docker-smoke:
    name: docker-smoke
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: huk-smoke
    steps:
      - uses: actions/checkout@v7
      - name: Generate a throwaway AUTH_SECRET at runtime (never committed)
        run: echo "AUTH_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - name: Build both images
        run: docker compose build
      - name: Start the stack and wait for health
        run: docker compose up -d --wait --wait-timeout 180
      - name: Both containers run as non-root (H-108)
        run: |
          web_uid="$(docker compose exec -T web id -u)"
          worker_uid="$(docker compose exec -T worker id -u)"
          echo "web uid=$web_uid worker uid=$worker_uid"
          [ "$web_uid" != "0" ] || { echo "web runs as root"; exit 1; }
          [ "$worker_uid" != "0" ] || { echo "worker runs as root"; exit 1; }
      - name: Worker image has ffprobe/ffmpeg, fpcalc and the policy file (H-204, H-205)
        run: |
          docker compose exec -T worker ffprobe -version | head -1
          docker compose exec -T worker ffmpeg -version | head -1
          docker compose exec -T worker fpcalc -version | head -1
          docker compose exec -T worker test -f policy/moderation-policy.md
          echo "worker ffmpeg + fpcalc + policy: OK"
      - name: GET /api/health answers 200
        run: |
          code="$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/health)"
          echo "health: $code"
          [ "$code" = "200" ]
      - name: GET /api/radio/now answers 200
        run: |
          code="$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/radio/now)"
          echo "radio/now: $code"
          [ "$code" = "200" ]
      - name: Compose logs contain no S8 boot failure
        run: |
          docker compose logs > compose-logs.txt || true
          cat compose-logs.txt
          if grep -qiE "Invalid environment \(S8\)|refusing to start" compose-logs.txt; then
            echo "S8 boot failure found in the logs"
            exit 1
          fi
      - name: Worker stops cleanly on SIGTERM (exit 0)
        run: docker compose stop worker
      - name: Dump compose logs on failure
        if: failure()
        run: docker compose logs > compose-logs.txt || true
      - name: Upload compose logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs
          path: compose-logs.txt
      - name: Tear down
        if: always()
        run: docker compose down -v
