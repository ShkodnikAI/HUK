name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read

jobs:
  invariants:
    name: invariants (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - name: Route authorization guard (S1)
        run: node scripts/ci/check-route-auth.mjs
      - name: No raw outbound HTTP (S4)
        run: node scripts/ci/check-no-raw-fetch.mjs
      - name: Docs are English (AGENTS §9)
        run: node scripts/ci/check-docs-language.mjs
      - name: No large files / databases in git
        run: node scripts/ci/check-large-files.mjs
      - name: No direct process.env outside src/server/env.ts (S8, H-107)
        run: node scripts/ci/check-no-process-env.mjs
      - name: No edge runtime — Node.js only (S8 boot validation, H-109)
        run: node scripts/ci/check-no-edge-runtime.mjs
      - name: Provider adapters fetch only through budget.guard (S6, H-204)
        run: node scripts/ci/check-provider-guard.mjs
      - name: Audio writes confined to the broadcast cache (S3, D14, H-112)
        run: |
          node scripts/ci/audio-store.mjs
          node scripts/ci/audio-store.mjs --selftest
      - name: Prod compose renders and passes the invariant checker (H-504 task 7)
        run: |
          docker compose -f deploy/docker-compose.prod.yml --env-file deploy/tests/fake-prod.env config --format json > /tmp/prod-rendered.json
          node scripts/ci/check-prod-compose.mjs /tmp/prod-rendered.json
      - name: The same checker must reject a deliberately broken stack (H-504 task 7)
        run: |
          docker compose -f deploy/tests/bad-compose.fixture.yml config --format json > /tmp/bad-rendered.json
          if node scripts/ci/check-prod-compose.mjs /tmp/bad-rendered.json; then
            echo "FAIL: the checker accepted a deliberately broken stack"
            exit 1
          fi
          echo "checker rejected the broken fixture as required"
      - name: shellcheck on the deploy scripts (H-504 task 3)
        run: shellcheck deploy/*.sh deploy/tests/*.sh
      - name: check-env.sh test suite (H-504 task 2)
        run: sh deploy/tests/check-env.test.sh

  secrets:
    name: gitleaks (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  detect:
    name: detect app scaffold
    runs-on: ubuntu-latest
    outputs:
      has_app: ${{ steps.check.outputs.has_app }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        # hashFiles() is not allowed in jobs.<id>.if, only inside steps;
        # this job exposes the result so `app` can be skipped until H-003.
        run: |
          if [ -f package.json ]; then echo "has_app=true" >> "$GITHUB_OUTPUT"; else echo "has_app=false" >> "$GITHUB_OUTPUT"; fi

  app:
    name: lint-typecheck-test-build (blocking)
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.has_app == 'true'
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: ci, POSTGRES_DB: huk }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:ci@localhost:5432/huk
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx prisma validate
      - run: bunx prisma migrate deploy
        if: hashFiles('prisma/migrations/**') != ''
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      # H-306: the database suite must also pass against a database whose
      # DEFAULT time zone is not UTC — the condition that silently broke the
      # station on the Owner's host (Europe/Minsk). The runner ALTERs the
      # database default zone, proves it took effect, then runs tests/db;
      # red here means the time-zone mechanism or the explicit SQL broke.
      - name: DB suite under a non-UTC database — Europe/Minsk (H-306)
        run: bun tests/db/run-under-timezone.mjs Europe/Minsk
      - name: DB suite under a non-UTC database — America/Los_Angeles (H-306)
        run: bun tests/db/run-under-timezone.mjs America/Los_Angeles
      - run: bun run build

  branch-freshness:
    name: branch-freshness (blocking)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: PR must not be far behind main
        run: |
          behind=$(git rev-list --count HEAD..origin/main || echo 0)
          echo "behind main by $behind commits"
          [ "$behind" -le 20 ] || { echo "Rebase onto main first"; exit 1; }

  # H-111: proves the compose stack boots end to end and the images stay
  # non-root. NOT a required check — the Owner decides on ruleset inclusion.
  docker-smoke:
    name: docker-smoke
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: huk-smoke
    steps:
      - uses: actions/checkout@v7
      - name: Generate a throwaway AUTH_SECRET at runtime (never committed)
        run: echo "AUTH_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - name: Build both images
        run: docker compose build
      - name: Start the stack and wait for health
        run: docker compose up -d --wait --wait-timeout 180
      - name: Both containers run as non-root (H-108)
        run: |
          web_uid="$(docker compose exec -T web id -u)"
          worker_uid="$(docker compose exec -T worker id -u)"
          echo "web uid=$web_uid worker uid=$worker_uid"
          [ "$web_uid" != "0" ] || { echo "web runs as root"; exit 1; }
          [ "$worker_uid" != "0" ] || { echo "worker runs as root"; exit 1; }
      - name: Worker image has ffprobe/ffmpeg, fpcalc and the policy file (H-204, H-205)
        run: |
          docker compose exec -T worker ffprobe -version | head -1
          docker compose exec -T worker ffmpeg -version | head -1
          docker compose exec -T worker fpcalc -version | head -1
          docker compose exec -T worker test -f policy/moderation-policy.md
          echo "worker ffmpeg + fpcalc + policy: OK"
      - name: GET /api/health answers 200
        run: |
          code="$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/health)"
          echo "health: $code"
          [ "$code" = "200" ]
      - name: GET /api/radio/now answers 200
        run: |
          code="$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/radio/now)"
          echo "radio/now: $code"
          [ "$code" = "200" ]
      - name: Compose logs contain no S8 boot failure
        run: |
          docker compose logs > compose-logs.txt || true
          cat compose-logs.txt
          if grep -qiE "Invalid environment \(S8\)|refusing to start" compose-logs.txt; then
            echo "S8 boot failure found in the logs"
            exit 1
          fi
      - name: Worker stops cleanly on SIGTERM (exit 0)
        run: docker compose stop worker
      - name: Dump compose logs on failure
        if: failure()
        run: docker compose logs > compose-logs.txt || true
      - name: Upload compose logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: compose-logs
          path: compose-logs.txt
      - name: Tear down
        if: always()
        run: docker compose down -v

  # H-504: full drill of the PRODUCTION stack (deploy/docker-compose.prod.yml)
  # with throw-away secrets and no tunnel (--no-tunnel). Proves the done
  # criteria on every PR: the stack boots from the prod file, a migration ran,
  # /api/health answers on the loopback port, only web publishes a port,
  # update.sh rolls a broken image back automatically, the backup -> restore
  # round trip lands the data in a scratch database, and the kill switch takes
  # the site offline and back. NOT a required check — the Owner decides on
  # ruleset inclusion.
  deploy-smoke:
    name: deploy-smoke (prod stack drill)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Write a throw-away deploy/.env (never committed)
        run: |
          cd deploy
          cat > .env <<EOF
          POSTGRES_USER="huk"
          # hex, not base64: the password is interpolated into DATABASE_URL by
          # the compose file — a base64 `/` or `@` breaks the URL (P1013).
          POSTGRES_PASSWORD="$(openssl rand -hex 16)"
          POSTGRES_DB="huk"
          AUTH_SECRET="$(openssl rand -base64 32)"
          NEXTAUTH_URL="https://hukradio.com"
          IP_HASH_SALT="$(openssl rand -base64 24)"
          CLIENT_IP_HEADER="cf-connecting-ip"
          EMAIL_SERVER="smtp://ci-smoke:ci-smoke@smtp.ci-smoke.invalid:587"
          EMAIL_FROM="HUK <no-reply@hukradio.com>"
          SEED_AUDIO_BASE_URL="https://hukradio.com/seed"
          AUDIO_CACHE_DIR="/var/lib/huk/audio-cache"
          CLOUDFLARE_TUNNEL_TOKEN="ci-smoke-fake-tunnel-token-not-a-secret"
          HUK_WEB_PORT="3100"
          HUK_BACKUP_DIR="/tmp/huk-ci-backups"
          EOF
          chmod 600 .env
      - name: First start without the tunnel (deploy/up.sh --no-tunnel)
        run: sh deploy/up.sh --no-tunnel
      - name: Migration ran (web applies prisma migrations before start)
        run: |
          n="$(docker compose -p huk -f deploy/docker-compose.prod.yml --env-file deploy/.env exec -T postgres psql -U huk -d huk -At -c 'SELECT count(*) FROM _prisma_migrations')"
          echo "migrations applied: $n"
          [ "$n" -ge 1 ]
      - name: Only web publishes a port, loopback-only (live check)
        run: |
          echo "web published: $(docker port huk-web-1)"
          docker port huk-web-1 | grep -q '3000/tcp -> 127\.0\.0\.1:3100'
          # docker port prints nothing (exit 0) when a container publishes
          # nothing — so an empty output is the assertion, not the exit code.
          for s in postgres worker seed-audio; do
            m="$(docker port "huk-$s-1" || true)"
            [ -z "$m" ] || { echo "FAIL: $s publishes: $m"; exit 1; }
          done
          echo "only web publishes, on 127.0.0.1:3100; nothing else is published"
      - name: Every service reports healthy
        run: |
          docker compose -p huk -f deploy/docker-compose.prod.yml --env-file deploy/.env ps
          for s in postgres web worker seed-audio; do
            st="$(docker inspect --format '{{.State.Health.Status}}' "huk-$s-1")"
            echo "$s health: $st"
            [ "$st" = "healthy" ] || { echo "FAIL: $s is $st"; exit 1; }
          done
      - name: update.sh rolls a broken image back automatically (task 3)
        run: |
          docker build -t huk/huk-web:broken -t huk/huk-worker:broken -f- . <<'DOCKERFILE'
          FROM busybox:1.36
          CMD ["false"]
          DOCKERFILE
          if sh deploy/update.sh broken --no-tunnel; then
            echo "FAIL: update.sh accepted a broken image"
            exit 1
          fi
          echo "update.sh failed as expected and rolled back to the previous tag"
      - name: Stack healthy again on the previous tag
        run: |
          code=000
          for i in $(seq 1 45); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/api/health || true)"
            [ "$code" = "200" ] && break
            sleep 2
          done
          echo "health after rollback: $code"
          [ "$code" = "200" ]
      - name: backup -> restore round trip into a scratch DB (done criteria)
        run: |
          c() { docker compose -p huk -f deploy/docker-compose.prod.yml --env-file deploy/.env "$@"; }
          c exec -T postgres psql -U huk -d huk -c "CREATE TABLE drill_marker (id int PRIMARY KEY, note text)"
          c exec -T postgres psql -U huk -d huk -c "INSERT INTO drill_marker VALUES (42, 'h-504-ci-drill')"
          out="$(sh deploy/backup.sh deploy/.env)"
          echo "$out"
          dump="$(printf '%s\n' "$out" | sed -n 's/^backup OK: \(.*\) (.*/\1/p')"
          [ -f "$dump" ] || { echo "FAIL: dump not found: $dump"; exit 1; }
          live="$(c exec -T postgres psql -U huk -d huk -At -c 'SELECT count(*) FROM "Track"')"
          scratch="$(sh deploy/restore.sh "$dump" deploy/.env | sed -n 's/^restored into database \(.*\) (scratch.*/\1/p')"
          echo "scratch database: $scratch"
          marker="$(c exec -T postgres psql -U huk -d "$scratch" -At -c 'SELECT note FROM drill_marker WHERE id = 42')"
          [ "$marker" = "h-504-ci-drill" ] || { echo "FAIL: drill_marker did not survive the round trip: '$marker'"; exit 1; }
          restored="$(c exec -T postgres psql -U huk -d "$scratch" -At -c 'SELECT count(*) FROM "Track"')"
          echo "Track rows: live=$live restored=$restored"
          [ "$live" = "$restored" ]
      - name: Kill switch — stop takes the site offline, start brings it back (task 5)
        run: |
          c() { docker compose -p huk -f deploy/docker-compose.prod.yml --env-file deploy/.env "$@"; }
          c stop web seed-audio
          code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:3100/api/health || true)"
          [ "$code" != "200" ] || { echo "FAIL: site still answers after the kill switch"; exit 1; }
          echo "site offline (health code: $code)"
          c start web seed-audio
          code=000
          for i in $(seq 1 45); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/api/health || true)"
            [ "$code" = "200" ] && break
            sleep 2
          done
          echo "site back online (health code: $code)"
          [ "$code" = "200" ]
      - name: Dump deploy logs on failure
        if: failure()
        run: |
          docker compose -p huk -f deploy/docker-compose.prod.yml --env-file deploy/.env logs --no-color > deploy-smoke-logs.txt || true
      - name: Upload deploy logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: deploy-smoke-logs
          path: deploy-smoke-logs.txt
      - name: Tear down (volumes included)
        if: always()
        run: docker compose -p huk -f deploy/docker-compose.prod.yml --env-file deploy/.env down -v
