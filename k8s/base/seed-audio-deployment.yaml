apiVersion: apps/v1
kind: Deployment
metadata:
  name: huk-seed-audio
  labels:
    app.kubernetes.io/name: huk
    app.kubernetes.io/component: seed-audio
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: huk
      app.kubernetes.io/component: seed-audio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: huk
        app.kubernetes.io/component: seed-audio
    spec:
      # Fully non-root nginx: the config (huk-seed-nginx, generated from
      # scripts/seed-nginx.conf) listens on 8080 and keeps pid/temp files
      # under /tmp, so uid 101 (the `nginx` user in the alpine image) runs the
      # whole server. No image change needed; the Service maps 80 -> 8080.
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: seed-audio
          image: nginx:1.29-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: 32Mi
              cpu: 25m
            limits:
              memory: 128Mi    # compose stack limit
              cpu: 250m
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: seed-audio
              mountPath: /var/www/seed
              readOnly: true
            # Full main config (not conf.d: files there are included inside
            # the stock http{} block, where events/http are illegal).
            - name: nginx-conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
      volumes:
        - name: seed-audio
          persistentVolumeClaim:
            claimName: seed-audio
        - name: nginx-conf
          configMap:
            name: huk-seed-nginx
            items:
              - key: seed-nginx.conf
                path: nginx.conf
