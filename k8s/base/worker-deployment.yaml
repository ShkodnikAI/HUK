apiVersion: apps/v1
kind: Deployment
metadata:
  name: huk-worker
  labels:
    app.kubernetes.io/name: huk
    app.kubernetes.io/component: worker
spec:
  # Recreate: the worker is the single timeline writer (pg advisory lock,
  # ADR-0004). A rolling update would run two workers at once; a brief gap is
  # the same trade-off the compose stack made.
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: huk
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: huk
        app.kubernetes.io/component: worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: huk/huk-worker
          imagePullPolicy: IfNotPresent
          # No command override: the image CMD is `bun run worker`, and the
          # worker NEVER migrates (ARCHITECTURE §2).
          envFrom:
            - secretRef:
                name: huk-env
          # The compose stack ordered worker after `web: service_healthy`:
          # on first boot the schema exists only after web runs
          # `prisma migrate deploy`. The `kill -0 1` probes prove PID 1 (the
          # worker process) is alive — the same check the compose healthcheck
          # used.
          readinessProbe:
            exec:
              command: ["sh", "-c", "kill -0 1"]
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["sh", "-c", "kill -0 1"]
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 1536Mi   # HUK_WORKER_MEM default (ffmpeg/fpcalc are heavy)
              cpu: "1"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # H-112 (D14): the worker is the only writer of the broadcast cache.
            - name: audio-cache
              mountPath: /var/lib/huk/audio-cache
      volumes:
        - name: audio-cache
          persistentVolumeClaim:
            claimName: audio-cache
      initContainers:
        # The compose stack ordered worker after `web: service_healthy`: on
        # first boot the schema exists only after web runs
        # `prisma migrate deploy`. This init container reproduces exactly that
        # ordering inside Kubernetes.
        - name: wait-for-web
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              i=0
              while [ "$i" -lt 120 ]; do
                if wget -qO- http://huk-web:3000/api/health >/dev/null 2>&1; then
                  echo "web is healthy; starting worker"
                  exit 0
                fi
                i=$((i + 1))
                sleep 2
              done
              echo "FAIL: web did not become healthy in 240s" >&2
              exit 1
          resources:
            requests:
              memory: 16Mi
              cpu: 10m
            limits:
              memory: 64Mi
              cpu: 100m
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534    # nobody; busybox needs no writes here
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
