apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: huk-postgres
  labels:
    app.kubernetes.io/name: huk
    app.kubernetes.io/component: postgres
spec:
  serviceName: huk-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: huk
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: huk
        app.kubernetes.io/component: postgres
    spec:
      # The official postgres image runs as uid 999; local-path (k3s) applies
      # fsGroup to the volume via its helper, so the data dir is owned by 999.
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16
          imagePullPolicy: IfNotPresent
          # PGDATA in a subdirectory so the volume root (which may contain
          # lost+found) is not assumed to be empty.
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          envFrom:
            - secretRef:
                name: huk-env
          ports:
            - name: pg
              containerPort: 5432
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "${POSTGRES_DB:-huk}"
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "${POSTGRES_DB:-huk}"
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              memory: 256Mi
              cpu: 250m
            limits:
              memory: 1Gi      # HUK_PG_MEM default from the compose stack
              cpu: "1"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi       # patched to 10Gi in overlays/prod-no-tunnel
