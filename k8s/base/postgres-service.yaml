apiVersion: v1
kind: Service
metadata:
  name: huk-postgres
  labels:
    app.kubernetes.io/name: huk
    app.kubernetes.io/component: postgres
spec:
  # ClusterIP only: postgres is reachable from inside the namespace, never
  # from the host or the internet (the compose stack never published it either).
  type: ClusterIP
  selector:
    app.kubernetes.io/name: huk
    app.kubernetes.io/component: postgres
  ports:
    - name: pg
      port: 5432
      targetPort: pg
