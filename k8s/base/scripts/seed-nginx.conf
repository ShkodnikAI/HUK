# HUK seed audio server (H-504, Kubernetes edition): serves the generated
# seed files (scripts/seed-content/make_seed.py) from the seed-audio PVC,
# read-only. Reached only through the Cloudflare Tunnel ingress
# (hukradio.com/seed* -> huk-seed-audio:80 — see docs/RUNBOOK.md); no port is
# published. Seed files are immutable once generated, but slugs are reused
# across regenerations, so the cache horizon stays at one day instead of an
# immutable year.
#
# Kubernetes edition differences from the compose file: listens on 8080 (the
# pod runs as the non-root `nginx` user, uid 101, which cannot bind 80) and
# keeps pid/temp files under /tmp (the default /var/run paths are root-only).
# The Service maps port 80 -> targetPort 8080, so the tunnel config is
# unchanged.
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
  worker_connections 128;
}

http {
  access_log /dev/stdout;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  server {
    listen 8080;
    server_name _;

    # Probe for the readiness/liveness checks.
    location = /healthz {
      access_log off;
      add_header Content-Type "text/plain";
      return 200 "ok\n";
    }

    location /seed/ {
      alias /var/www/seed/;
      autoindex off;
      types {
        audio/mpeg mp3;
        application/json json;
      }
      default_type application/octet-stream;
      add_header Cache-Control "public, max-age=86400";
      add_header X-Content-Type-Options "nosniff" always;
    }

    # The tunnel routes only /seed* here; anything else is a miss.
    location / {
      return 404;
    }
  }
}
