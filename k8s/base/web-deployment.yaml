apiVersion: apps/v1
kind: Deployment
metadata:
  name: huk-web
  labels:
    app.kubernetes.io/name: huk
    app.kubernetes.io/component: web
spec:
  # Recreate, not RollingUpdate: the web pod applies prisma migrations before
  # start, and two web pods racing on the same database is exactly what the
  # compose stack avoided by having a single container. A short gap on release
  # is accepted (one shared timeline; "cheap by default").
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: huk
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: huk
        app.kubernetes.io/component: web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000       # the `bun` user baked into the image (H-108)
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: huk/huk-web
          imagePullPolicy: IfNotPresent
          # Same command as the compose stack: migrations run in the web
          # container before start; the worker never migrates (ARCHITECTURE §2).
          command: ["sh", "-c", "bunx prisma migrate deploy && bun run start"]
          envFrom:
            - secretRef:
                name: huk-env
          ports:
            - name: http
              containerPort: 3000
          # First boot runs the full migration set before start — the
          # startupProbe gives it room before liveness/readiness kick in.
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 1Gi      # HUK_WEB_MEM default from the compose stack
              cpu: "1"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # H-112 (D14): web serves the broadcast cache read-only.
            - name: audio-cache
              mountPath: /var/lib/huk/audio-cache
              readOnly: true
      volumes:
        - name: audio-cache
          persistentVolumeClaim:
            claimName: audio-cache
