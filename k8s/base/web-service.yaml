apiVersion: v1
kind: Service
metadata:
  name: huk-web
  labels:
    app.kubernetes.io/name: huk
    app.kubernetes.io/component: web
spec:
  # ClusterIP only: nothing is published to the host. The tunnel reaches this
  # service from inside the cluster; humans reach it via `kubectl port-forward`
  # (RUNBOOK) — the same loopback-only property the compose stack had.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: huk
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 3000
      targetPort: http
