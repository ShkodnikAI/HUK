# Seed track registration (RUNBOOK §8): one-shot, idempotent (upsert by
# externalId). Uses the worker image — ffprobe is needed to measure durations.
# The image tag MUST match the imported release (RUNBOOK §6).
#
#   kubectl delete job huk-seed-register -n huk --ignore-not-found
#   kubectl apply -f k8s/jobs/seed-register.yaml
#   kubectl -n huk wait --for=condition=complete job/huk-seed-register --timeout=900s
#   kubectl -n huk logs job/huk-seed-register
#   kubectl -n huk delete job huk-seed-register
apiVersion: batch/v1
kind: Job
metadata:
  name: huk-seed-register
  namespace: huk
  labels:
    app.kubernetes.io/name: huk
    app.kubernetes.io/component: seed-audio
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: huk
        app.kubernetes.io/component: seed-audio
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # The tracks table exists only after web applied the migrations — same
      # ordering rule as the worker.
      initContainers:
        - name: wait-for-web
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              i=0
              while [ "$i" -lt 120 ]; do
                if wget -qO- http://huk-web:3000/api/health >/dev/null 2>&1; then
                  exit 0
                fi
                i=$((i + 1))
                sleep 2
              done
              echo "FAIL: web did not become healthy in 240s" >&2
              exit 1
          resources:
            requests:
              memory: 16Mi
              cpu: 10m
            limits:
              memory: 64Mi
              cpu: 100m
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
      containers:
        - name: register
          # Bump this tag together with the overlay tags (RUNBOOK §6).
          image: huk/huk-worker:v0-bootstrap
          imagePullPolicy: IfNotPresent
          command: ["bun", "prisma/seed-tracks.ts", "/seed"]
          envFrom:
            - secretRef:
                name: huk-env
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: seed
              mountPath: /seed
              readOnly: true
      volumes:
        - name: seed
          persistentVolumeClaim:
            claimName: seed-audio
