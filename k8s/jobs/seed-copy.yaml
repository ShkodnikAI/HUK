# Seed audio upload pod (RUNBOOK §8).
#
# The seed-audio Deployment mounts its PVC read-only, so files cannot be
# copied through it. This helper Job runs for 2 hours with the same PVC
# mounted read-write, and you copy the generated seed files into it:
#   kubectl delete job huk-seed-copy -n huk --ignore-not-found
#   kubectl apply -f k8s/jobs/seed-copy.yaml
#   kubectl -n huk wait --for=condition=ready pod -l job-name=huk-seed-copy --timeout=120s
#   POD=$(kubectl -n huk get pod -l job-name=huk-seed-copy -o jsonpath='{.items[0].metadata.name}')
#   kubectl cp public/seed/. huk/"$POD":/var/www/seed
#   kubectl -n huk delete job huk-seed-copy
# Then register the files as SEED tracks with k8s/jobs/seed-register.yaml.
apiVersion: batch/v1
kind: Job
metadata:
  name: huk-seed-copy
  namespace: huk
  labels:
    app.kubernetes.io/name: huk
    app.kubernetes.io/component: seed-audio
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 7200
  template:
    metadata:
      labels:
        app.kubernetes.io/name: huk
        app.kubernetes.io/component: seed-audio
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 101         # same uid the seed-audio nginx reads with
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: copy
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "echo 'copy seed files with kubectl cp, then delete this job'; sleep 7200"]
          resources:
            requests:
              memory: 16Mi
              cpu: 10m
            limits:
              memory: 64Mi
              cpu: 100m
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: seed
              mountPath: /var/www/seed
      volumes:
        - name: seed
          persistentVolumeClaim:
            claimName: seed-audio
