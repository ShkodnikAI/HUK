# MUST reject it. If the checker accepts this overlay, the checker is broken,
# not this fixture ("a checker that cannot fail is not a check").
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: huk
resources:
  - bad-manifests.yaml
