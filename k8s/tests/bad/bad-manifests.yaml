# Deliberately broken stack — every rule the invariant checker enforces is
# violated here at least once. Never deployed anywhere; used only by the CI
# step that proves the checker rejects a broken stack.
#
# Violations: a Secret in git (S8), a NodePort service (published port), a
# workload missing from the stack, hostNetwork, hostPath (docker.sock!), a
# privileged root container without limits/probes, an unpinned :latest image,
# a hostPort, and a Deployment without the Recreate strategy.
apiVersion: v1
kind: Secret
metadata:
  name: oops-secrets-in-git
  namespace: huk
stringData:
  NOTE: "never commit secrets — the checker must reject this whole object (S8)"
---
apiVersion: v1
kind: Service
metadata:
  name: huk-web
  namespace: huk
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: bad
  ports:
    - port: 3000
      nodePort: 30300
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: huk-web
  namespace: huk
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bad
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bad
    spec:
      hostNetwork: true
      containers:
        - name: web
          image: huk/huk-web:latest
          imagePullPolicy: Always
          securityContext:
            privileged: true
          ports:
            - containerPort: 3000
              hostPort: 3000
      volumes:
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
